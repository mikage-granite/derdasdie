<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>der die das</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="root">

<!-- MENU -->
<div id="menu" class="screen active">
  <div class="menu-hero"><h1>der die das</h1><p>ドイツ語学習アプリ</p></div>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-gender" onclick="UI.switchTab('gender')">冠詞</button>
    <button class="mode-tab" id="tab-spell" onclick="UI.switchTab('spell')">スペリング</button>
    <button class="mode-tab" id="tab-prep" onclick="UI.switchTab('prep')">前置詞</button>
  </div>
  <div id="gender-toggle-area" style="padding:0 1.5rem 0.4rem;display:none;">
    <div class="toggle-row">
      <div><div class="toggle-label">日本語訳を表示</div><div class="toggle-sub">冠詞モードのカードに訳を表示</div></div>
      <label class="toggle"><input type="checkbox" id="tg-trans" onchange="Store.setShowTrans(this.checked)">
      <div class="toggle-track"></div><div class="toggle-thumb"></div></label>
    </div>
  </div>
  <div class="menu-stats-row" id="menu-stats-row">
    <div class="stat-pill"><div class="val" id="m-studied">—</div><div class="lbl" id="m-lbl-studied">学習済み</div></div>
    <div class="stat-pill"><div class="val" id="m-today-ok">—</div><div class="lbl" id="m-lbl-today">正答率</div></div>
    <div class="stat-pill"><div class="val" id="m-acc">—</div><div class="lbl" id="m-lbl-acc">今日の正解</div></div>
  </div>
  <div id="menu-cards"></div>
  <div style="height:calc(env(safe-area-inset-bottom,0)+1.2rem)"></div>
</div>

<!-- STUDY -->
<div id="study" class="screen">
  <div class="study-header">
    <div class="back-btn" onclick="UI.goMenu()">‹</div>
    <div class="study-title" id="study-title"></div>
    <div class="streak-badge">🔥<span id="st-streak">0</span></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="st-progress" style="width:0%"></div></div>
    <div class="progress-label"><span id="st-count">0/0</span><span id="st-score-lbl">正解 0</span></div>
  </div>
  <div class="last-result-area">
    <div class="last-result" id="last-result">
      <div class="lr-icon" id="lr-icon"></div>
      <div class="lr-body"><div class="lr-answer" id="lr-answer"></div><div class="lr-sub" id="lr-sub"></div></div>
    </div>
  </div>
  <div class="card-area" id="card-area">
    <div class="card-stack">
      <div class="card is-next" id="next-card">
        <div class="card-q-label" id="next-label"></div>
        <div class="card-word" id="next-word"></div>
      </div>
      <div class="card is-active" id="active-card">
        <div class="card-bg" id="card-bg"></div>
        <div class="card-lbl lbl-left" id="lbl-left"></div>
        <div class="card-lbl lbl-up" id="lbl-up"></div>
        <div class="card-lbl lbl-right" id="lbl-right"></div>
        <div class="card-lbl lbl-down" id="lbl-down"></div>
        <div class="card-imp" id="card-imp"></div>
        <div class="card-q-label" id="card-q-label"></div>
        <div class="card-word" id="st-word"></div>
        <div class="card-trans" id="st-trans"></div>
        <div class="card-stat" id="st-hist"></div>
      </div>
    </div>
  </div>
  <div id="choice-area"></div>
  <div class="study-footer" id="study-footer"></div>
</div>

<!-- SPELLING -->
<div id="spelling" class="screen">
  <div class="study-header">
    <div class="back-btn" onclick="UI.goMenu()">‹</div>
    <div class="study-title" id="sp-title">スペリング</div>
    <div class="streak-badge">🔥<span id="sp-streak">0</span></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="sp-progress" style="width:0%"></div></div>
    <div class="progress-label"><span id="sp-count">0/0</span><span id="sp-score-lbl">正解 0</span></div>
  </div>
  <div id="sp-main">
    <div class="sp-question">
      <div class="sp-q-label">ドイツ語でスペルを入力</div>
      <div class="sp-prompt" id="sp-prompt"></div>
      <div class="sp-type" id="sp-type"></div>
    </div>
    <div class="sp-input-area">
      <div class="sp-copy-hint" id="sp-copy-hint">答えを確認 — 正しいスペルを写してください</div>
      <div class="sp-display" id="sp-display"></div>
      <div class="sp-feedback" id="sp-feedback"></div>
      <button class="sp-skip-btn" id="sp-skip-btn" onclick="SpellMode.skip()">わからない → 答えを見る</button>
    </div>
    <div class="sp-keyboard" id="sp-keyboard"></div>
  </div>
  <div class="study-footer" id="sp-footer"></div>
</div>

<!-- PREPOSITIONS -->
<div id="prep-screen" class="screen">
  <div class="study-header">
    <div class="back-btn" onclick="UI.goMenu()">‹</div>
    <div class="study-title" id="prep-title">前置詞</div>
    <div class="streak-badge">🔥<span id="prep-streak">0</span></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="prep-progress" style="width:0%"></div></div>
    <div class="progress-label"><span id="prep-count">0/0</span><span id="prep-score-lbl">正解 0</span></div>
  </div>
  <!-- 前回の結果バナー -->
  <div class="last-result-area">
    <div class="last-result" id="prep-last-result">
      <div class="lr-icon" id="prep-lr-icon"></div>
      <div class="lr-body"><div class="lr-answer" id="prep-lr-answer"></div><div class="lr-sub" id="prep-lr-sub"></div></div>
    </div>
  </div>
  <!-- 問題カード（スタック構造） -->
  <div class="card-area" id="prep-card-area">
    <div class="card-stack">
      <div class="card is-next" id="prep-next-card">
        <div class="card-q-label" id="prep-next-label"></div>
        <div class="card-word" id="prep-next-word"></div>
      </div>
      <div class="card is-active" id="prep-card" style="touch-action:none;cursor:grab;will-change:transform;">
        <div class="card-bg" id="prep-card-bg"></div>
        <div class="card-lbl lbl-left" id="prep-lbl-left"></div>
        <div class="card-lbl lbl-up" id="prep-lbl-up"></div>
        <div class="card-lbl lbl-right" id="prep-lbl-right"></div>
        <div class="card-lbl lbl-down" id="prep-lbl-down"></div>
        <div class="card-q-label">格支配は？</div>
        <div class="card-word" id="prep-word"></div>
        <div class="card-trans" id="prep-trans"></div>
        <div class="card-stat" id="prep-hist"></div>
      </div>
    </div>
  </div>
  <!-- 4択ボタン -->
  <div class="quiz-choices" id="prep-choices"></div>
  <div style="min-height:44px;margin:0 1rem 0.3rem;border-radius:12px;padding:0.5rem 0.9rem;font-size:12px;font-weight:400;text-align:center;opacity:0;transition:opacity 0.2s;" id="prep-example"></div>
  <div class="study-footer" id="prep-footer"></div>
</div>

<!-- STATS -->
<div id="stats" class="screen">
  <div class="stats-header">
    <div class="back-btn" onclick="UI.goMenu()">‹</div>
    <h2>成績</h2>
  </div>
  <div class="stats-overview">
    <div class="ov-card"><div class="ov-val" id="sv-studied">0</div><div class="ov-lbl">学習済み</div></div>
    <div class="ov-card"><div class="ov-val" id="sv-acc">—</div><div class="ov-lbl">正答率</div></div>
    <div class="ov-card"><div class="ov-val" id="sv-today">0</div><div class="ov-lbl">今日の正解</div></div>
  </div>
  <div class="stats-filter" id="stats-filter-row">
    <button class="sf-btn active" onclick="Stats.setFilter('all',this)">すべて</button>
    <button class="sf-btn sf-studied" onclick="Stats.setFilter('studied',this)">学習済み</button>
    <button class="sf-btn sf-weak" onclick="Stats.setFilter('weak',this)">苦手</button>
    <button class="sf-btn sf-important" onclick="Stats.setFilter('important',this)">重要語</button>
    <button class="sf-btn sf-unstudied" onclick="Stats.setFilter('unstudied',this)">未学習</button>
  </div>
  <div class="word-list" id="word-list"></div>
</div>

</div>

<!-- スクリプトの読み込み（順番に注意） -->
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/modes.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
